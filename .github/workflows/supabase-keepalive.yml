name: Supabase Keepalive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 \
            "https://iyopjzyzgtcrtflvxfne.supabase.co/rest/v1/page_stats?select=views&limit=1" \
            -H "apikey: sb_publishable_C22bTdhZqsjA2ElynKG3Ug_n7z6XhPP" \
            -H "Authorization: Bearer sb_publishable_C22bTdhZqsjA2ElynKG3Ug_n7z6XhPP"
